name: Platform-Client-TopMarket-Service-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Client.TopMarket


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v2.0.0

extends:
  template: dotnetservice.yml@bt
  parameters:
    runtime: win-x64
    authToFeeds: false
    projects:
      - Platform/Platform.Client.TopMarket
