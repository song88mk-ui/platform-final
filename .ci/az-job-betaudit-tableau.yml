name: $(System.TeamProject)-Platform-Job-BetAudit-Tableau-$(Build.BuildId).$(Rev:r)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Job.BetAudit.Tableau


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v0.2.0
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice2.yml@bt
  parameters:
    dotnetVersion: 3.1.x
    autoToFeeds: false
    projects:
      - Platform/Platform.Job.BetAudit.Tableau
