name: Platform-Job-CCF-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Job.CCF
      - Platform/Platform.Shared


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.8.0

extends:
  template: dotnetservice.yml@bt
  parameters:
    pool:
      vmImage: 'windows-2019'
    runtime: win-x64
    authToFeeds: false
    projects:
      - Platform/Platform.Job.CCF
