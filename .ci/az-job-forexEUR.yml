name: Platform-Job-ForexEUR-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Job.ForexEUR
      - Platform/Platform.Shared


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.5.0
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice.yml@bt
  parameters:
    runtime: win-x64
    projects:
      - Platform/Platform.Job.ForexEUR
