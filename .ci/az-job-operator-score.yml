name: Platform-Job-Operator-Score-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Job.Operator.Score


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.8.0

extends:
  template: dotnetservice.yml@bt
  parameters:
    authToFeeds: false
    projects:
      - Platform/Platform.Job.Operator.Score
