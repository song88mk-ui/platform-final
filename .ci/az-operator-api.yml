name: Platform-Operator-API-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Operator.API
      - Platform/Platform.Shared

resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.8.0

extends:
  template: dotnetservice.yml@bt
  parameters:
    dotnetVersion: '7.0.304'
    projects:
      - Platform/Platform.Operator.API
