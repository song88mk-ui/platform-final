name: Platform-Wallet-API-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Wallet.API

resources:
  repositories:
    - repository: templates
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v1.8.0

extends:
  template: dotnetservice.yml@templates
  parameters:
    authToFeeds: false
    projects:
      - Platform/Platform.Wallet.API

