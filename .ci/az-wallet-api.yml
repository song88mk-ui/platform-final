name: $(System.TeamProject)-Platform-Wallet-API-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Platform/Platform.Wallet.API

resources:
  repositories:
    - repository: templates
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v0.1.1
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice.yml@templates
  parameters:
    projects:
      - Platform/Platform.Wallet.API

