name: Placement-Service-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
      - docker
  paths:
    include:
      - Platform/Platform.Placement.Servicev2

resources:
  - repo: self

variables:
  ContainerRegistryConnection: 'd9ff7663-ca22-49ae-be23-83dd308dcef4'
  ImageRepository: platform-placement-service
  ContainerRegistry: song88.azurecr.io

stages:
  - stage: build
    displayName: Docker Build
    pool:
      vmImage: windows-latest
    jobs:
      - job: docker
        displayName: Docker
        steps:
          - task: Docker@2
            displayName: Build
            inputs:
              command: build
              buildContext: Platform
              repository: $(ImageRepository)
              dockerfile: Dockerfile.placement-service
              containerRegistry: $(ContainerRegistryConnection)

          - task: Docker@2
            displayName: Publish to ACR
            inputs:
              command: push
              repository: $(ImageRepository)
              containerRegistry: $(ContainerRegistryConnection)
