name: Platform-WebSocket-API2

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
      - test/*
  paths:
    include:
      - Platform/Platform.WebSocket.API2
    exclude:
      - README.md

pool:
  vmImage: ubuntu-latest

variables:
  SLACK_URL: "https://hooks.slack.com/services/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"  # ci-cd
  AppName: Platform-WebSocket-MessagePack-API
  ImageRepository: platform-websocket-msgpack-api
  ResourceGroup: rg-production-song88
  ContainerRegistry: song88.azurecr.io
  AzureConnection: azurerm-song88-prod-service

stages:
  - stage: build
    displayName: Build
    jobs:
      - job: docker
        displayName: Build
        steps:
          - task: Bash@3
            displayName: Set Build Id
            inputs:
              targetType: inline
              script: |
                PKG_VERSION=v$(jq -r '.version' .version)
                BUILD_NUMBER="Platform.WebSocket.API-${PKG_VERSION}.${BUILD_BUILDID}"
                echo "##vso[task.setvariable variable=VERSION]${PKG_VERSION}"
                echo "##vso[build.updatebuildnumber]${BUILD_NUMBER}"

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(ContainerRegistry)

          - task: Docker@2
            displayName: Docker Build
            inputs:
              command: build
              repository: $(ImageRepository)
              Dockerfile: Platform/Platform.Websocket.API2/Dockerfile
              buildContext: Platform/Platform.Websocket.API2
              arguments: --build-context shared=Platform
              containerRegistry: $(ContainerRegistry)
              tags: $(Build.BuildId)

          - task: Docker@2
            displayName: Push to ACR
            inputs:
              command: push
              repository: $(ImageRepository)
              containerRegistry: $(ContainerRegistry)
              tags: $(Build.BuildId)

  - stage: stage_staging_release
    dependsOn: build
    displayName: Staging::deployment.ACA 32290
    jobs:
      - deployment: Deployment
        displayName: Deploy to ACA
        pool:
          vmImage: "ubuntu-latest"
        environment:
          name: PREPROD_HK_WEB
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - task: AzureCLI@2
                  env:
                    TAG: $(Build.BuildId)
                    RG: $(ResourceGroup)
                    CA: ca-staging-plt-wsapi2
                    CR: $(ContainerRegistry)
                    REPO: $(ImageRepository)
                  inputs:
                    azureSubscription: $(AzureConnection)
                    visibleAzLogin: false
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az config set core.only_show_errors=True
                      az containerapp show -n ${CA} -g ${RG} -o none
                      ret=$(az containerapp update \
                        -n ${CA} -g ${RG} --output json \
                        -i ${CR}/${REPO}:${TAG} \
                        --container-name api | jq -r '.properties.provisioningState')
                      [[ $ret == "Succeeded" ]] && echo "Status: Success" && exit 0
                      echo "Status: ${ret}"
                      exit 1
            on:
              failure:
                steps:
                  - task: Bash@3
                    displayName: Notify CI/CD
                    inputs:
                      targetType: inline
                      script: |
                        curl -sd "{\"text\": \"Deployment Platform.WebSocket.MessagePack.API, Build: ${BUILD_BUILDID} to STAGING failed.\"}" ${SLACK_URL}
              success:
                steps:
                  - task: Bash@3
                    displayName: Notify CI/CD
                    inputs:
                      targetType: inline
                      script: |
                        curl -sd "{\"text\": \"Deployment Platform.WebSocket.MessagePack.API, Build: ${BUILD_BUILDID} to STAGING succeeded.\"}" ${SLACK_URL}
