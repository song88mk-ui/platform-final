name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types:
      - released

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.project }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - Platform.Shared.Test
          - Platform.Sportsbook.API.Test
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            3.1.x
            8.0.x

      - name: Add NuGet source
        run: |
          dotnet nuget add source \
            --username FlyingCockatoo \
            --password ${{ secrets.NUGET_PASSWORD }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/FlyingCockatoo/index.json"

      - name: Install libssl1.1 (netcoreapp3.1 runtime dependency)
        # netcoreapp3.1's test host requires libssl1.1, but Ubuntu dropped it from its repos
        # as of 24.04 (the current ubuntu-latest), which ships libssl3 only — so it can't be
        # apt-installed and has to be pulled from Ubuntu's archived security package instead.
        # Remove this step once Platform.Sportsbook.API.Test is upgraded off netcoreapp3.1.
        run: |
          curl -sSL -O http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          rm libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb

      - name: Test ${{ matrix.project }}
        run: dotnet test Platform/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release

  build:
    name: Build ${{ matrix.app.path }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - path: Platform.API
            image: platform-platform-api
          - path: Platform.BetForwarder.Service
            image: platform-betforwarder-service
          - path: Platform.BetInfo.Service
            image: platform-betinfo-service
          - path: Platform.BetStatus.Service
            image: platform-betstatus-service
          - path: Platform.Betting.API
            image: platform-betting-api
          - path: Platform.CacheSync.Service
            image: platform-cachesync-service
          - path: Platform.Provider.Service
            image: platform-provider-service
          - path: Platform.CashOut.Service
            image: platform-cashout-service
          - path: Platform.CashOutStake.Servicev2
            image: platform-cashoutstake-service
          - path: Platform.Client.API
            image: platform-client-api
          - path: Platform.Client.TopMarket
            image: platform-client-topmarket-service
          - path: Platform.ClientPlatform.API
            image: platform-clientplatform-api
          - path: Platform.ClientSportsbook.API
            image: platform-clientsportsbook-api
          - path: Platform.Job.CCF
            image: platform-job-ccf
          - path: Platform.Job.ForexEUR
            image: platform-job-forexeur
          - path: Platform.Job.Operator.Score
            image: platform-job-operator-score
          - path: Platform.Job.Resettlement
            image: platform-job-resettlement
          - path: Platform.Operator.API
            image: platform-operator-api
          - path: Platform.Operator.Cashout.Service
            image: platform-operator-cashout-service
          - path: Platform.Operator.Servicev2
            image: platform-operator-service
          - path: Platform.Placement.Servicev2
            image: platform-placement-service
          - path: Platform.RabbitMQ.API
            image: platform-rabbitmq-api
          - path: Platform.Settlement.Service
            image: platform-settlement-service
          - path: Platform.Sportsbook.API
            image: platform-sportsbook-api
          - path: Platform.Wallet.API
            image: platform-wallet-api
          - path: Platform.Websocket.API2
            image: platform-websocket-api

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-stg" ]]; then
            echo "environment=stg" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
            echo "aws_region=ap-south-1" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-prd" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
            echo "aws_account_id=525375333516" >> $GITHUB_OUTPUT
            echo "aws_region=ap-east-1" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        if: github.event_name == 'release'
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: |
            ${{ steps.env.outputs.aws_account_id }}.dkr.ecr.${{ steps.env.outputs.aws_region }}.amazonaws.com/${{ matrix.app.image }}
          tags: |
            type=sha,event=pr,prefix=pr-sha-
            type=sha,event=branch,prefix={{branch}}-sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        if: github.event_name == 'release'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ steps.env.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.aws_account_id }}:role/github-oidc-ecr-push-role
          role-duration-seconds: 3600
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        if: github.event_name == 'release'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Build
        if: github.event_name != 'release'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          file: Platform/${{ matrix.app.path }}/Dockerfile
          push: false
          tags: image:latest
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Build & Push
        if: github.event_name == 'release'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          file: Platform/${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Logout to Amazon ECR
        if: github.event_name == 'release'
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
