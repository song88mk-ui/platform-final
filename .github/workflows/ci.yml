name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR: 418541840646.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build:
    name: Build ${{ matrix.app.path }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - path: Platform.API
            image: platform-api
          - path: Platform.BetForwarder.Service
            image: platform-betforwarder-service
          - path: Platform.BetInfo.Service
            image: platform-betinfo-service
          - path: Platform.BetStatus.Service
            image: platform-betstatus-service
          - path: Platform.Betting.API
            image: platform-betting-api
          - path: Platform.CacheSync.Service
            image: platform-cachesync-service
          - path: Platform.Cancellation.Service
            image: platform-cancellation-service
          - path: Platform.CashOut.Service
            image: platform-cashout-service
          - path: Platform.CashOutStake.Servicev2
            image: platform-cashoutstake-service
          - path: Platform.Client.API
            image: platform-client-api
          - path: Platform.Client.TopMarket
            image: platform-client-topmarket-service
          - path: Platform.ClientPlatform.API
            image: platform-clientplatform-api
          - path: Platform.ClientSportsbook.API
            image: platform-clientsportsbook-api
          - path: Platform.Job.CCF
            image: platform-job-ccf
          - path: Platform.Job.ForexEUR
            image: platform-job-forexeur
          - path: Platform.Job.Operator.Score
            image: platform-job-operator-score
          - path: Platform.Job.Resettlement
            image: platform-job-resettlement
          - path: Platform.Operator.API
            image: platform-operator-api
          - path: Platform.Operator.Cashout.Service
            image: platform-operator-cashout-service
          - path: Platform.Operator.Servicev2
            image: platform-operator-service
          - path: Platform.Placement.Servicev2
            image: platform-placement-service
          - path: Platform.RabbitMQ.API
            image: platform-rabbitmq-api
          - path: Platform.Settlement.Service
            image: platform-settlement-service
          - path: Platform.Sportsbook.API
            image: platform-sportsbook-api
          - path: Platform.Wallet.API
            image: platform-wallet-api
          - path: Platform.Websocket.API2
            image: platform-websocket-api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Affected Files
        id: app-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: |
            'Platform/${{ matrix.app.path }}/**'
            'Platform/Platform.Shared/**'

      - name: Changes Check
        id: proceed
        if: steps.app-changes.outputs.any_changed == 'true'
        run: |
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Docker meta
        if: steps.proceed.outputs.proceed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.ECR }}/${{ matrix.app.image }}
          tags: |
            type=sha,event=pr,prefix=pr-sha-
            type=sha,event=branch,prefix={{branch}}-sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        if: steps.proceed.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: steps.proceed.outputs.proceed == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::418541840646:role/github-oidc-ecr-push-role

      - name: Login to Amazon ECR
        if: steps.proceed.outputs.proceed == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        if: steps.proceed.outputs.proceed == 'true'
        uses: docker/build-push-action@v6
        with:
          file: Platform/${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Logout to Amazon ECR
        if: success() && steps.proceed.outputs.proceed == 'true'
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
