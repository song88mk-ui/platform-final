name: Remove old branches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  cleanup:
    name: Remove old branches
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: clean
        uses: beatlabs/delete-old-branches-action@v0.0.10
        with:
          repo_token: ${{ github.token }}
          date: '1 month ago'
          dry_run: false
          delete_tags: false
          extra_protected_branch_regex: 'main|master|^release.*|EXCL-.*'
          exclude_open_pr_branches: true
